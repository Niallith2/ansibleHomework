---
- name: "Enable ingress"
  shell: "minikube addons enable ingress"
  become: yes

- name: "Create Moon namespace"
  shell: "kubectl create namespace moon --dry-run=client -o yaml | kubectl apply -f -"
  register: namespace_result
  changed_when: "'created' in namespace_result.stdout"

- name: "Add helm repo"
  shell: "helm repo add aerokube https://charts.aerokube.com"
  register: repo_result
  changed_when: "'has been added' in repo_result.stdout"

- name: "Update helm repos"
  shell: "helm repo update"

- name: "Deploy moon"
  shell: |
    helm upgrade --install moon aerokube/moon2 \
      --namespace moon \
      --create-namespace \
      --set ingress.host=moon.aerokube.local \
      --set ui.enabled=true \
      --wait

- name: "Set hosts"
  shell: "echo '192.168.49.2 moon.aerokube.local' | sudo tee -a /etc/hosts"